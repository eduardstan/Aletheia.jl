# Pull requests and manual dispatch run the full three-version Linux and Windows
# matrix. Main pushes use one Julia version on Ubuntu: the August 2026 CI-minute
# budget motivated keeping branch protection real without restoring six-way cost.

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Julia ${{ matrix.julia-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows test setup and cache cleanup can exceed ten minutes even when
    # the package tests themselves pass.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 12 || 10 }}
    strategy:
      fail-fast: false
      matrix: ${{ github.event_name == 'push' && fromJSON('{"julia-version":["1.12"],"os":["ubuntu-latest"]}') || fromJSON('{"julia-version":["1.10","1.11","1.12"],"os":["ubuntu-latest","windows-latest"]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1

  documentation:
    # Main pushes publish docs; pull requests and manual runs still build them.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Documentation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Build and deploy documentation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl

  coverage:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Run tests with coverage
        shell: bash
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'
      - name: Enforce line coverage
        shell: bash
        run: julia --project=coverage -e 'using Pkg; Pkg.instantiate(); include("coverage/check.jl")'
